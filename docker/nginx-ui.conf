server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: same-origin /api/* → Nest container. Nest should use setGlobalPrefix('api') and listen on :3000.
    # Docker DNS resolver defers upstream lookup so nginx starts even when `api` service is not running.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
